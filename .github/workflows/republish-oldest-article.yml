name: Republish oldest resource article

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Republish the oldest article and rebuild resources
        run: python scripts/generate_articles.py
      - name: Commit daily publication update
        run: |
          if git diff --quiet; then
            echo "An article has already been published today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          git commit -m "Republish oldest resource article"
          git push
